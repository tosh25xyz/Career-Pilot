version: '3.9'

services:
  # ─── PostgreSQL with pgvector ───────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: careerpilot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: careerpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────────
  backend:
    build: ./backend
    container_name: careerpilot_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/careerpilot
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
